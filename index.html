<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para María Belén 💖</title>  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1em;
      cursor: pointer;
    }

    .yes {
      background: #fff;
      color: #ff4d6d;
      font-weight: bold;
    }

    .no {
      background: rgba(255,255,255,0.3);
      color: #fff;
      position: absolute;
    }

    .message {
      margin-top: 25px;
      font-size: 1.3em;
      font-weight: bold;
      display: none;
    }

    /* Overlay foto */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 1.5s;
      z-index: 5;
    }

    .overlay img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 24px;
      animation: zoomIn 1.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.7); }
      to { transform: scale(1); }
    }

    /* Corazones */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: float 6s linear forwards;
      z-index: 1;
    }

    @keyframes float {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-110vh); opacity: 0; }
    }
  </style></head>
<body>  <div class="card">
    <h1>💖 ¿Quieres ser mi San Valentín, María Belén? 💖</h1>
    <p>Prometo cuidarte, hacerte reír y amarte cada día un poquito más ✨</p><div class="buttons">
  <button class="yes" onclick="sayYes()">Sí 💕</button>
  <button class="no" id="noBtn">No 🙈</button>
</div>

<div id="message" class="message"></div>

  </div>  <!-- Música (YouTube) -->  <iframe id="music" width="0" height="0" allow="autoplay" style="display:none"></iframe>  <script>
    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('click', moveButton);

    function moveButton() {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 150 - 75;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function sayYes() {
      const msg = document.getElementById('message');
      msg.style.display = 'block';
      msg.innerHTML = '💖 Gracias por escogerme, María Belén. Te amo 💘';

      // Música
      document.getElementById('music').src = 'https://www.youtube.com/embed/5kzZQzjY4xQ?autoplay=1';

      // Overlay con foto
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = '<img src="foto.jpg" alt="Nosotros">';
      document.body.appendChild(overlay);

      startHearts();
    }

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = Math.random() * 20 + 15 + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }, 300);
    }
  </script></body>
</html>
